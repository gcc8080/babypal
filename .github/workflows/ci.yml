name: CI

# iOS v1 不上真机（见 design.md D12），其回归职责全部由本 workflow 的
# ios-build job 承担——每次提交能免签名编译通过即视为通过。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-android:
    name: analyze / test / Android debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pubspec.lock 里的 hosted url 必须是 pub.dev。pub 把 host 当成 source 标识
      # 的一部分，只要 lock 里写的是镜像（本机开了 PUB_HOSTED_URL 就会这样），CI
      # 这边默认 host 对不上，整份 lock 会被丢弃重新解析——等于没锁版本。
      - name: 校验 pubspec.lock 未被镜像 URL 污染
        run: |
          if grep -nE 'url: "https://(pub\.flutter-io\.cn|mirrors\.|pub\.dartlang\.org)' pubspec.lock; then
            echo "::error file=pubspec.lock::pubspec.lock 含非 pub.dev 的 hosted url，CI 会丢弃整份 lock 重新解析依赖。修复：本地执行 env -u PUB_HOSTED_URL flutter pub get 后重新提交。"
            exit 1
          fi

      # --enforce-lockfile：解析结果与 lock 不一致就直接失败，而不是默默升版本。
      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      - name: build Android debug APK
        run: flutter build apk --debug

  ios-build:
    name: iOS 免签名编译
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: build iOS (no codesign)
        run: flutter build ios --no-codesign
